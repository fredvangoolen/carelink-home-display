<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400"
     font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Hoe het scherm aan zijn cijfers komt</title>
  <desc id="d">De pomp stuurt zijn metingen via Bluetooth naar de telefoon van
  de patiënt, de telefoon stuurt ze via het internet naar CareLink van Medtronic,
  en een klein kastje bij jou thuis haalt ze daar om de vijf minuten op en geeft
  ze door aan het scherm.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1000" height="400" fill="#ffffff"/>

  <!-- two zones -->
  <rect x="20" y="40" width="430" height="300" rx="16" fill="#f4f6f8"/>
  <text x="235" y="72" font-size="18" font-weight="bold" fill="#1f2933" text-anchor="middle">Bij de patiënt, waar die ook is</text>
  <rect x="610" y="40" width="370" height="300" rx="16" fill="#fdf3ec"/>
  <text x="795" y="72" font-size="18" font-weight="bold" fill="#1f2933" text-anchor="middle">Bij jou thuis</text>

  <!-- pump -->
  <g transform="translate(70 130)">
    <rect x="0" y="0" width="90" height="120" rx="14" fill="#e3e7e3" stroke="#6b7680" stroke-width="2"/>
    <rect x="12" y="14" width="66" height="44" rx="4" fill="#ffffff" stroke="#6b7680" stroke-width="1.5"/>
    <text x="45" y="43" font-size="18" font-weight="bold" fill="#1f2933" text-anchor="middle">117</text>
    <circle cx="45" cy="88" r="16" fill="#ffffff" stroke="#6b7680" stroke-width="1.5"/>
  </g>
  <text x="115" y="285" font-size="17" fill="#1f2933" text-anchor="middle">Insulinepomp</text>
  <text x="115" y="306" font-size="14" fill="#5b6470" text-anchor="middle">met zijn sensor</text>

  <!-- phone -->
  <g transform="translate(300 115)">
    <rect x="0" y="0" width="80" height="150" rx="14" fill="#2b2f33"/>
    <rect x="7" y="16" width="66" height="114" rx="4" fill="#e3e7e3"/>
    <text x="40" y="78" font-size="18" font-weight="bold" fill="#1f2933" text-anchor="middle">117</text>
  </g>
  <text x="340" y="285" font-size="17" fill="#1f2933" text-anchor="middle">Telefoon van de patiënt</text>
  <text x="340" y="306" font-size="14" fill="#5b6470" text-anchor="middle">MiniMed-app, online</text>

  <path d="M168 190 H290" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="229" y="180" font-size="14" fill="#5b6470" text-anchor="middle">Bluetooth</text>

  <!-- cloud -->
  <path transform="translate(-30 0)" d="M478 205 q-28 0 -28 -26 q0 -28 32 -28 q8 -26 40 -26 q34 0 42 30 q30 -2 30 26 q0 24 -28 24 z"
        fill="#e8eef5" stroke="#6b7680" stroke-width="2"/>
  <text x="495" y="285" font-size="17" fill="#1f2933" text-anchor="middle">CareLink</text>
  <text x="495" y="306" font-size="14" fill="#5b6470" text-anchor="middle">de cloud van Medtronic</text>

  <path d="M388 190 H416" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <!-- Pi -->
  <g transform="translate(640 150)">
    <rect x="0" y="0" width="100" height="70" rx="10" fill="#d9e4d4" stroke="#6b7680" stroke-width="2"/>
    <circle cx="20" cy="50" r="5" fill="#2f855a"/>
    <rect x="58" y="22" width="30" height="26" rx="3" fill="#ffffff" stroke="#6b7680" stroke-width="1.2"/>
  </g>
  <text x="690" y="285" font-size="17" fill="#1f2933" text-anchor="middle">Het kastje</text>
  <text x="690" y="306" font-size="14" fill="#5b6470" text-anchor="middle">een Raspberry Pi</text>

  <path d="M578 185 H632" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="606" y="158" font-size="13" fill="#5b6470" text-anchor="middle">om de</text>
  <text x="606" y="174" font-size="13" fill="#5b6470" text-anchor="middle">5 min</text>

  <!-- display -->
  <g transform="translate(840 125)">
    <rect x="0" y="0" width="110" height="120" rx="10" fill="#f5f5f3" stroke="#6b7680" stroke-width="2"/>
    <rect x="12" y="14" width="86" height="84" fill="#e3e7e3" stroke="#6b7680" stroke-width="1.2"/>
    <text x="46" y="60" font-size="28" font-weight="bold" fill="#1f2933" text-anchor="middle">117</text>
    <path d="M74 47 h10 v-5 l9 8 l-9 8 v-5 h-10 z" fill="#1f2933"/>
    <text x="55" y="86" font-size="10" fill="#1f2933" text-anchor="middle">3 min ago</text>
  </g>
  <text x="895" y="285" font-size="17" fill="#1f2933" text-anchor="middle">Het scherm</text>
  <text x="895" y="306" font-size="14" fill="#5b6470" text-anchor="middle">via je wifi</text>

  <path d="M748 185 H832" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="790" y="175" font-size="14" fill="#5b6470" text-anchor="middle">wifi</text>

  <text x="500" y="382" font-size="15" fill="#5b6470" text-anchor="middle">De cijfers gaan maar in één richting. Niets bij jou thuis kan iets aan de pomp veranderen.</text>
</svg>
