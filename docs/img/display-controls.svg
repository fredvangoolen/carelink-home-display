<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="1000" height="820"
     font-family="Helvetica, Arial, sans-serif" role="img"
     aria-labelledby="t d">
  <title id="t">The controls of the display</title>
  <desc id="d">Front view of the M5Stack Core Ink display with six numbered
  parts: side switch, power button, top button, screen, USB-C socket and reset
  button on the back; below it the five screens in the order the side switch steps
  through them.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
    <g id="mini">
      <rect width="100" height="100" rx="4" fill="#e3e7e3" stroke="#6b7680" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="1000" height="820" fill="#ffffff"/>

  <!-- ============================================================ device -->
  <!-- body, with the recess on the right that holds the switch (from level
       with the screen's top to about its middle): the wheel stays inside the
       body's outline. The power button sits lower, level with the screen's
       bottom edge -->
  <path d="M380 120 H620 Q640 120 640 140 V192 L631 201 V311 L640 320 V492
           Q640 512 620 512 H380 Q360 512 360 492 V140 Q360 120 380 120 Z"
        fill="#f5f5f3" stroke="#6b7680" stroke-width="2"/>
  <!-- top button -->
  <rect x="424" y="112" width="170" height="23" rx="6" fill="#fbfbfa" stroke="#6b7680" stroke-width="2"/>
  <!-- mounting holes -->
  <g fill="#f5f5f3" stroke="#9aa3ab" stroke-width="1.5">
    <circle cx="392" cy="150" r="13"/><circle cx="608" cy="150" r="13"/>
    <circle cx="392" cy="482" r="13"/><circle cx="608" cy="482" r="13"/>
  </g>
  <g fill="#c9ced2">
    <circle cx="392" cy="150" r="7"/><circle cx="608" cy="150" r="7"/>
    <circle cx="392" cy="482" r="7"/><circle cx="608" cy="482" r="7"/>
  </g>
  <!-- side switch and power button -->
  <rect x="629" y="236" width="10" height="44" rx="3" fill="#2b2f33"/>
  <path d="M632 258 H639" stroke="#8a939b" stroke-width="1.5"/>
  <rect x="634" y="390" width="9" height="20" rx="4.5" fill="#dfe7ec" stroke="#6b7680" stroke-width="1.2"/>
  <!-- USB-C socket on the underside -->
  <rect x="484" y="507" width="32" height="8" rx="4" fill="#2b2f33"/>

  <!-- screen -->
  <rect x="400" y="200" width="198" height="195" fill="#e3e7e3" stroke="#6b7680" stroke-width="1.5"/>
  <g fill="#1f2933">
    <text x="412" y="282" font-size="76" font-weight="bold" letter-spacing="-2">112</text>
    <path d="M540 255 h26 v-11 l20 17 l-20 17 v-11 h-26 z"/>
    <text x="414" y="310" font-size="17">mg/dL</text>
    <rect x="410" y="322" width="178" height="1.5"/>
    <text x="412" y="362" font-size="13">Act. insulin</text>
    <text x="588" y="362" font-size="20" text-anchor="end">1.2 U</text>
    <text x="412" y="385" font-size="11.5">Updated 3 min ago</text>
    <text x="588" y="385" font-size="11.5" text-anchor="end">13:41</text>
  </g>

  <!-- ============================================== markers on the drawing -->
  <g stroke="#c2410c" stroke-width="1.5" fill="none">
    <path d="M643 258 H661"/>
    <path d="M645 400 H661"/>
    <path d="M509 99 V110"/>
    <path d="M339 297 H402"/>
    <path d="M500 517 V531"/>
  </g>
  <circle cx="404" cy="297" r="2.5" fill="#c2410c"/>
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <g fill="#c2410c">
      <circle cx="672" cy="258" r="11"/><circle cx="672" cy="400" r="11"/>
      <circle cx="509" cy="88" r="11"/><circle cx="328" cy="297" r="11"/>
      <circle cx="500" cy="542" r="11"/>
    </g>
    <g fill="#ffffff">
      <text x="672" y="262.5">1</text><text x="672" y="404.5">2</text>
      <text x="509" y="92.5">3</text><text x="328" y="301.5">4</text>
      <text x="500" y="546.5">5</text>
    </g>
  </g>

  <!-- ====================================================== legend, right -->
  <g fill="#1f2933" font-size="13.5">
    <circle cx="726" cy="145" r="11" fill="#c2410c"/>
    <text x="726" y="149.500" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="746" y="150" font-size="16" font-weight="bold">Side switch</text>
    <text x="746" y="172" fill="#4b5560">The only control you need.</text>
    <path d="M748 188 h10 l-5 8 z" fill="#c2410c"/>
    <text x="766" y="197"><tspan font-weight="bold">Flick down:</tspan> next screen</text>
    <path d="M748 218 h10 l-5 -8 z" fill="#c2410c"/>
    <text x="766" y="219"><tspan font-weight="bold">Flick up:</tspan> previous screen</text>
    <circle cx="753" cy="236" r="4.5" fill="#c2410c"/>
    <text x="766" y="241"><tspan font-weight="bold">Press in:</tspan> not for daily use</text>

    <circle cx="726" cy="295" r="11" fill="#c2410c"/>
    <text x="726" y="299.500" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="746" y="300" font-size="16" font-weight="bold">Power button</text>
    <text x="746" y="322" fill="#4b5560">Starts the display again after it</text>
    <text x="746" y="340" fill="#4b5560">was stopped with the reset button</text>
    <text x="746" y="358" fill="#4b5560">or has switched off: press briefly.</text>
  </g>

  <!-- ======================================================= legend, left -->
  <g fill="#1f2933" font-size="13.5">
    <circle cx="41" cy="95" r="11" fill="#c2410c"/>
    <text x="41" y="99.500" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="61" y="100" font-size="16" font-weight="bold">Top button</text>
    <text x="61" y="122" fill="#4b5560">Not used.</text>

    <circle cx="41" cy="175" r="11" fill="#c2410c"/>
    <text x="41" y="179.500" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="61" y="180" font-size="16" font-weight="bold">Screen</text>
    <text x="61" y="202" fill="#4b5560">Keeps its last picture even with</text>
    <text x="61" y="220" fill="#4b5560">no power. Look at the time on it:</text>
    <text x="61" y="238" fill="#4b5560">it should be a few minutes old.</text>

    <circle cx="41" cy="291" r="11" fill="#c2410c"/>
    <text x="41" y="295.500" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="61" y="296" font-size="16" font-weight="bold">USB-C socket</text>
    <text x="61" y="318" fill="#4b5560">On the underside. Power: use the</text>
    <text x="61" y="336" fill="#4b5560">adapter, not a computer's USB port.</text>

    <circle cx="41" cy="389" r="11" fill="#c2410c"/>
    <text x="41" y="393.500" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="61" y="394" font-size="16" font-weight="bold">Reset button</text>
    <text x="61" y="416" fill="#4b5560">A small button on the back. It</text>
    <text x="61" y="434" fill="#4b5560">stops the display. On the cable it</text>
    <text x="61" y="452" fill="#4b5560">starts again by itself; without</text>
    <text x="61" y="470" fill="#4b5560">the cable, button 2 starts it again.</text>
  </g>
  <!-- small back view -->
  <g>
    <rect x="62" y="488" width="60" height="84" rx="6" fill="#f5f5f3" stroke="#6b7680" stroke-width="1.5"/>
    <circle cx="92" cy="552" r="4" fill="#2b2f33"/>
    <path d="M97 552 H137" stroke="#c2410c" stroke-width="1.5"/>
    <circle cx="148" cy="552" r="11" fill="#c2410c"/>
    <text x="148" y="556.500" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>
    <text x="92" y="590" font-size="12" fill="#4b5560" text-anchor="middle">back</text>
  </g>

  <!-- ===================================================== the five screens -->
  <rect x="30" y="612" width="940" height="1" fill="#d5dade"/>
  <text x="30" y="642" font-size="16" font-weight="bold" fill="#1f2933">The five screens, in the order the side switch steps through them</text>

  <g font-size="10.5" fill="#1f2933">
    <g transform="translate(105 662)">
      <use href="#mini"/>
      <text x="10" y="50" font-size="34" font-weight="bold">112</text>
      <path d="M72 36 h8 v-4 l8 6.500 l-8 6.500 v-4 h-8 z"/>
      <text x="10" y="68">mg/dL</text>
      <text x="10" y="90">3 min ago</text>
    </g>
    <g transform="translate(275 662)">
      <use href="#mini"/>
      <text x="8" y="18">3 h</text>
      <path d="M8 40 H92 M8 76 H92" stroke="#2b2f33" stroke-width="1" stroke-dasharray="3 3"/>
      <polyline points="8,60 18,48 28,36 38,34 48,38 56,52 66,64 76,70 84,66" fill="none" stroke="#1f2933" stroke-width="2.5"/>
      <circle cx="84" cy="66" r="3.5" fill="#1f2933"/>
      <text x="50" y="94" text-anchor="middle" font-size="9">08   09   10</text>
    </g>
    <g transform="translate(445 662)">
      <use href="#mini"/>
      <text x="10" y="24">In range</text><text x="90" y="24" text-anchor="end">89 %</text>
      <text x="10" y="44">Above</text><text x="90" y="44" text-anchor="end">9 %</text>
      <text x="10" y="64">Below</text><text x="90" y="64" text-anchor="end">2 %</text>
      <text x="10" y="84">Average</text><text x="90" y="84" text-anchor="end">131</text>
    </g>
    <g transform="translate(615 662)">
      <use href="#mini"/>
      <text x="10" y="28">Reservoir</text><text x="90" y="28" text-anchor="end">82 %</text>
      <text x="10" y="54">Battery</text><text x="90" y="54" text-anchor="end">100 %</text>
      <text x="10" y="80">Sensor</text><text x="90" y="80" text-anchor="end">110 h</text>
    </g>
    <g transform="translate(785 662)">
      <use href="#mini"/>
      <text x="10" y="28">WiFi</text><text x="90" y="28" text-anchor="end">home</text>
      <text x="10" y="54">Signal</text><text x="90" y="54" text-anchor="end">good</text>
      <text x="10" y="80">Battery</text><text x="90" y="80" text-anchor="end">100 %</text>
    </g>
  </g>

  <g stroke="#c2410c" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M215 712 H265"/><path d="M385 712 H435"/><path d="M555 712 H605"/><path d="M725 712 H775"/>
  </g>

  <g font-size="13.5" font-weight="bold" fill="#1f2933" text-anchor="middle">
    <text x="155" y="782">Glucose</text>
    <text x="325" y="782">Trend</text>
    <text x="495" y="782">Statistics</text>
    <text x="665" y="782">Pump</text>
    <text x="835" y="782">Device &amp; Network</text>
  </g>
  <text x="500" y="806" font-size="12.5" fill="#4b5560" text-anchor="middle">Flick down follows the arrows, flick up goes back; after the last screen comes the first. At the next reading the display returns to Glucose by itself.</text>
</svg>
