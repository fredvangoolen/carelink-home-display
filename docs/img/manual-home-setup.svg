<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"
     font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The set in your home</title>
  <desc id="d">The gateway, a Raspberry Pi, sits next to your internet router and
  is plugged into one of its free network sockets with a cable, and into a
  power socket. The display stands somewhere you pass by, such as the kitchen,
  on its own USB power adapter, and connects to the router over your WiFi.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1000" height="470" fill="#ffffff"/>

  <!-- rooms -->
  <rect x="20" y="20" width="470" height="400" rx="16" fill="#f4f6f8"/>
  <text x="40" y="54" font-size="18" font-weight="bold" fill="#1f2933">Where the internet comes in</text>
  <rect x="510" y="20" width="470" height="400" rx="16" fill="#fdf3ec"/>
  <text x="530" y="54" font-size="18" font-weight="bold" fill="#1f2933">Somewhere you pass by, e.g. the kitchen</text>

  <!-- router -->
  <g transform="translate(70 130)">
    <rect x="0" y="0" width="200" height="70" rx="10" fill="#e3e7e3" stroke="#6b7680" stroke-width="2"/>
    <rect x="30" y="-34" width="6" height="36" rx="3" fill="#6b7680"/>
    <rect x="164" y="-34" width="6" height="36" rx="3" fill="#6b7680"/>
    <!-- LAN ports on the front -->
    <g fill="#2b2f33">
      <rect x="22" y="40" width="22" height="16" rx="2"/>
      <rect x="52" y="40" width="22" height="16" rx="2"/>
      <rect x="82" y="40" width="22" height="16" rx="2"/>
    </g>
    <rect x="112" y="40" width="22" height="16" rx="2" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/>
    <circle cx="170" cy="22" r="5" fill="#2f855a"/>
    <circle cx="152" cy="22" r="5" fill="#2f855a"/>
  </g>
  <text x="170" y="86" font-size="17" fill="#1f2933" text-anchor="middle">Your internet router</text>

  <!-- free port callout -->
  <path d="M204 184 L250 250" stroke="#c2410c" stroke-width="1.5" fill="none"/>
  <text x="256" y="262" font-size="14" fill="#c2410c">one free network socket</text>

  <!-- cable router -> Pi -->
  <path d="M193 186 C 205 300, 120 290, 130 330" stroke="#2b6cb0" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Pi -->
  <g transform="translate(80 330)">
    <rect x="0" y="0" width="110" height="60" rx="10" fill="#d9e4d4" stroke="#6b7680" stroke-width="2"/>
    <circle cx="20" cy="42" r="5" fill="#2f855a"/>
    <rect x="64" y="16" width="32" height="26" rx="3" fill="#ffffff" stroke="#6b7680" stroke-width="1.2"/>
  </g>
  <text x="135" y="410" font-size="15" fill="#1f2933" text-anchor="middle">The gateway (Raspberry Pi)</text>

  <!-- Pi power -->
  <path d="M190 365 C 240 365, 260 365, 300 365" stroke="#2b2f33" stroke-width="3" fill="none"/>
  <g transform="translate(300 345)">
    <rect x="0" y="0" width="44" height="40" rx="6" fill="#fbfbfa" stroke="#6b7680" stroke-width="2"/>
    <circle cx="15" cy="20" r="3.5" fill="#6b7680"/><circle cx="29" cy="20" r="3.5" fill="#6b7680"/>
  </g>
  <text x="362" y="362" font-size="14" fill="#5b6470">its own</text>
  <text x="362" y="380" font-size="14" fill="#5b6470">power adapter</text>

  <!-- WiFi waves from router -->
  <g fill="none" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round">
    <path d="M300 120 a 40 40 0 0 1 0 50"/>
    <path d="M318 105 a 62 62 0 0 1 0 80"/>
    <path d="M336 90 a 84 84 0 0 1 0 110"/>
  </g>
  <path d="M370 145 H620" stroke="#2b6cb0" stroke-width="2.5" stroke-dasharray="8 7" fill="none" marker-end="url(#a)"/>
  <text x="495" y="132" font-size="15" fill="#1f2933" text-anchor="middle">home WiFi (2.4 GHz)</text>

  <!-- display -->
  <g transform="translate(640 90)">
    <rect x="0" y="0" width="150" height="160" rx="12" fill="#f5f5f3" stroke="#6b7680" stroke-width="2"/>
    <rect x="16" y="20" width="118" height="112" fill="#e3e7e3" stroke="#6b7680" stroke-width="1.2"/>
    <text x="64" y="78" font-size="38" font-weight="bold" fill="#1f2933" text-anchor="middle">117</text>
    <path d="M100 62 h13 v-7 l12 11 l-12 11 v-7 h-13 z" fill="#1f2933"/>
    <text x="75" y="116" font-size="12" fill="#1f2933" text-anchor="middle">3 min ago</text>
  </g>
  <text x="715" y="280" font-size="17" fill="#1f2933" text-anchor="middle">The display</text>

  <!-- display power -->
  <path d="M775 252 C 778 310, 810 335, 840 348" stroke="#2b2f33" stroke-width="3" fill="none"/>
  <g transform="translate(840 330)">
    <rect x="0" y="0" width="44" height="40" rx="6" fill="#fbfbfa" stroke="#6b7680" stroke-width="2"/>
    <circle cx="15" cy="20" r="3.5" fill="#6b7680"/><circle cx="29" cy="20" r="3.5" fill="#6b7680"/>
  </g>
  <text x="862" y="392" font-size="14" fill="#5b6470" text-anchor="middle">a good USB charger,</text>
  <text x="862" y="410" font-size="14" fill="#5b6470" text-anchor="middle">not a computer's USB</text>

  <text x="500" y="455" font-size="15" fill="#5b6470" text-anchor="middle">No free socket on the router? The gateway can use the home WiFi instead; your helper sets that up.</text>
</svg>
